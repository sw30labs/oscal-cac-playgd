[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oscal-cac-playground"
version = "0.1.0"
description = "CLI for treating OSCAL as Compliance-as-Code: explain files, suggest remediation, and review diffs with LLM assistance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OSCAL CaC Playground Contributors" }
]
keywords = ["oscal", "compliance", "security", "nist", "langchain", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "langchain==1.4.8",
    "langchain-openai==1.7.3",
    "langchain-community==0.4.2",
    "langgraph==1.2.19",
    "typer==0.27.3",
    "rich==15.0.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[project.scripts]
oscal-cac = "oscal_cac.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/oscal-cac-playground"
Repository = "https://github.com/yourusername/oscal-cac-playground"

[tool.hatch.build.targets.wheel]
packages = ["src/oscal_cac"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
