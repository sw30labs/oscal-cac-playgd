[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oscal-cac-playground"
version = "0.1.0"
description = "CLI for treating OSCAL as Compliance-as-Code: explain files, suggest remediation, and review diffs with LLM assistance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OSCAL CaC Playground Contributors" }
]
keywords = ["oscal", "compliance", "security", "nist", "langchain", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
oscal-cac = "oscal_cac.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/oscal-cac-playground"
Repository = "https://github.com/yourusername/oscal-cac-playground"

[tool.hatch.build.targets.wheel]
packages = ["src/oscal_cac"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
